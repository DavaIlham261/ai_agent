services:
  backend:
    build: .
    container_name: agent-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - LITELLM_BASE_URL=http://litellm:4000
      - PROJECTS_FILES=/app/projects.yaml
    volumes:
      - ./projects.yaml:/app/projects.yaml
    depends_on:
      - redis
      - litellm
    mem_limit: "1500m"
    networks:
      - agent-net

  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: litellm-proxy
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    volumes:
      - ./litellm_config.yaml:/app/config.yaml
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://litellm:${LITELLM_DB_PASSWORD}@litellm-db:5432/litellm
    ports:
      - "4000:4000"    # opsional — boleh dilepas nanti kalau tidak perlu diakses dari luar backend
    dns:
      - 8.8.8.8
      - 1.1.1.1
    depends_on:
      - litellm-db
    networks:
      - agent-net

  redis:
    image: redis:7-alpine
    container_name: agent-redis
    networks:
      - agent-net

  litellm-db:
    image: postgres:16-alpine
    container_name: litellm-db
    environment:
      - POSTGRES_USER=litellm
      - POSTGRES_PASSWORD=${LITELLM_DB_PASSWORD}
      - POSTGRES_DB=litellm
    volumes:
      - litellm_db_data:/var/lib/postgresql/data
    networks:
      - agent-net

volumes:
  litellm_db_data:

networks:
  agent-net:
    driver: bridge
    

